name: AMP Console Package

on:
  pull_request:
    branches: ["main"]
    paths:
      - "console/**"
      - ".github/workflows/amp-console-package-pr-checks.yaml"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build]
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-console-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  # `pnpm build` above runs against the full checkout; the Docker build runs
  # against only what console/Dockerfile COPYs into the image. The two have
  # drifted four times (nightly runs #34, #47, #75, #108) and only the
  # nightly noticed — three weeks late in the last case, because the image
  # is built nowhere else. Build it here, same Dockerfile, no push.
  #
  # Runs on a GitHub-hosted runner rather than CodeBuild: that is where the
  # nightly and release builds run, so a pass here means the same thing.
  # amd64 only; the nightly's arm64 half is built from the same stage.
  docker-image:
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build console image
        run: |
          docker build \
            --platform linux/amd64 \
            --file console/Dockerfile \
            --build-arg VERSION=pr-${{ github.event.pull_request.number }} \
            --tag amp-console:pr-check \
            console
