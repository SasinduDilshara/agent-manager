{{- if and .Values.audit.enabled .Values.audit.reader.create (not .Values.audit.reader.existingSecret) }}
{{- $name := .Values.audit.reader.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 40 }}
{{- end }}
# Read-only OpenSearch identity for the Agent Manager audit query API. The
# password is generated once and kept across upgrades (lookup), and the Secret
# is kept on uninstall so the OpenSearch user it backs is not orphaned.
# Agent Manager runs in another namespace: copy this Secret there under the
# name agentManagerService.config.auditQuery.existingSecret expects (the
# quick-start installer manages both copies instead; see AUDIT_LOGS.md).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amp-observability-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-log-collection
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.audit.reader.username | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
