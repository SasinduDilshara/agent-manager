{{- if and .Values.audit.trafficLogging.enabled (not .Values.audit.trafficLogging.fingerprintKeySecret.name) }}
{{- $name := include "wso2-amp-gateway-extension.fingerprintSecretName" . }}
{{- $key := .Values.audit.trafficLogging.fingerprintKeySecret.key }}
{{- $existing := lookup "v1" "Secret" .Values.apiGateway.namespace $name }}
{{- $value := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key | b64dec }}
{{- else }}
{{- $value = randAlphaNum 48 }}
{{- end }}
# Key for the HMAC that protects API-key fingerprints in traffic records
# (traffic_logging.token_fingerprint_key). Generated once and kept across
# upgrades, so fingerprints stay comparable over time. To let Agent Manager
# join API-key calls to their keys, give every gateway and Agent Manager the
# same key instead (audit.trafficLogging.fingerprintKeySecret.name here,
# agentManagerService.config.auditQuery.fingerprintKeySecret there).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: traffic-logging
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
