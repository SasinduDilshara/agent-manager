# ClusterAuthzRole for the AMP Audit Reader outbound identity.
# agent-manager-service reads the audit trail through the OpenChoreo observer's
# audit API, which checks auditlogs:view at cluster scope only — the observer
# deliberately offers no per-namespace audit access. This role therefore grants
# that one action and nothing else, and agent-manager-service, not this
# binding, confines each read to the caller's organization: it forces the
# organization and producer filters on every query it makes with this identity.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: {{ .Values.authz.ampAuditReaderClient.role | default "amp-audit-reader" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  description: "Allows agent-manager-service to read the audit trail from the OpenChoreo observer"
  actions:
    - auditlogs:view
---
# ClusterAuthzRoleBinding for the AMP Audit Reader client.
# Matches on the client_id claim of amp-audit-reader-client's client_credentials
# tokens (the observer's auth config identifies service accounts by client_id).
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: amp-audit-reader-binding
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  effect: allow
  entitlement:
    claim: client_id
    value: {{ .Values.authz.ampAuditReaderClient.clientId | default "amp-audit-reader-client" }}
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: {{ .Values.authz.ampAuditReaderClient.role | default "amp-audit-reader" }}
